ui.param-descriptions = Flashlight utilities:\n\n[accent]Field of View (FOV)[] - The angle at which the cone light is spread outwards. It's measured in degrees.\n\n[accent]Line length[] - How many blocks does the light reach before getting attenuated?\n\n[accent]Line Width[] - How "thick" each individual rays of light are?\nValues closer to maximum will create a more coherent light cone, while values closer to 0 will make a Moire-like effect.\n[gray]Cool effect go brr[]
